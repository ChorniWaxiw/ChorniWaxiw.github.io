<h1>Король</h1>
<img src="king.jpg" width = "60" height="60">
Король в шахматах располагается в начальной позиции на поле e1 (для белых) и e8 (для чёрных).
Он вправе перемещаться лишь на одну клетку в любом направлении, при этом не допускается ход на поле, находящееся под ударом фигуры соперника.
