<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Снегопад на сайте — демо</title>
<style>
  :root {
    --flake-count: 150;   /* количество снежинок */
    --min-size: 1;        /* минимальный радиус, px */
    --max-size: 4;        /* максимальный радиус, px */
    --min-speed: 0.5;     /* минимальная скорость падения */
    --max-speed: 2.5;     /* максимальная скорость падения */
    --wind: 0.4;          /* сила ветра/дрейфа */
    --mouse-force: 120;   /* радиус отталкивания от курсора, px */
  }
  body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(#1a2a4a, #0d1526); color: #fff; min-height: 100vh; overflow-x: hidden; }
  .content { max-width: 720px; margin: 0 auto; padding: 60px 20px; text-align: center; }
  h1 { font-weight: 300; }
  #toggle {
    padding: 12px 24px; font-size: 16px; border: 1px solid rgba(255,255,255,.4);
    background: rgba(255,255,255,.08); color: #fff; border-radius: 24px; cursor: pointer; margin-top: 20px;
  }
  #toggle:hover { background: rgba(255,255,255,.18); }
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>
<div class="content">
  <h1>❄ Снегопад на canvas</h1>
  <p>Скролльте, двигайте мышь — снежинки дрейфуют от курсора.<br>Все настройки — в переменных <code>:root</code> в начале файла.</p>
  <button id="toggle">Скрыть снег</button>
</div>
<canvas id="snow"></canvas>
<script>
(function () {
  var canvas = document.getElementById('snow');
  var ctx = canvas.getContext('2d');
  var btn = document.getElementById('toggle');
  var count = 150, minSize = 1, maxSize = 4, minSpeed = 0.5, maxSpeed = 2.5,
      wind = 0.4, mouseForce = 120;
  var flakes = [], W, H, mX = -999, mY = -999, running = true;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  function makeFlake(startAnywhere) {
    var r = minSize + Math.random() * (maxSize - minSize);
    return {
      x: Math.random() * W,
      y: startAnywhere ? Math.random() * H : -r,
      r: r,
      vy: minSpeed + Math.random() * (maxSpeed - minSpeed),
      vx: (Math.random() - 0.5) * wind,
      phase: Math.random() * Math.PI * 2,
      opacity: 0.4 + Math.random() * 0.6
    };
  }
  function init() {
    resize();
    flakes = [];
    for (var i = 0; i < count; i++) flakes.push(makeFlake(true));
    requestAnimationFrame(tick);
  }
  function tick() {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.phase += 0.02;
      f.vx += Math.sin(f.phase) * 0.01;
      // отталкивание от курсора
      var dx = f.x - mX, dy = f.y - mY, dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < mouseForce && dist > 0) {
        f.vx += dx / dist * 0.6;
        f.vy += dy / dist * 0.3;
      }
      f.vx *= 0.98; // затухание
      f.x += f.vx + wind;
      f.y += f.vy;
      if (f.y > H + f.r) { flakes[i] = makeFlake(false); }
      if (f.x > W + f.r) f.x = -f.r;
      if (f.x < -f.r) f.x = W + f.r;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + f.opacity + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', function (e) { mX = e.clientX; mY = e.clientY; });
  btn.addEventListener('click', function () {
    running = !running;
    if (running) {
      requestAnimationFrame(tick);
      btn.textContent = 'Скрыть снег';
    } else {
      ctx.clearRect(0, 0, W, H);
      btn.textContent = 'Включить снег';
    }
    localStorage.setItem('snow_off', running ? '0' : '1');
  });
  if (localStorage.getItem('snow_off') === '1') {
    btn.click();
  } else {
    init();
  }
})();
</script>
</body>
</html>
