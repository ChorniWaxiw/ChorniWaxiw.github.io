<h1>Слон</h1>
<img src="slon.jpg" width = "60" height="60">
У каждой стороны их по два: у белых — на c1 и f1, у чёрных — на c8 и f8. Иными словами, они стоят рядом с конями и смотрят прямо по диагоналям. Один слон всегда ходит по белым полям, другой — по чёрным. Поэтому их часто так и называют: белопольный и чернопольный.
