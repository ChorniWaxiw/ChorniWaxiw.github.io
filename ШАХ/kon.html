<h1>Конь</h1>
<img src="kon-chern.jpg" width = "60" height="60">
В начальной расстановке у каждой стороны по два коня. У белых они стоят на полях b1 и g1, у чёрных — на b8 и g8. Тот конь, что ближе к королю, иногда называют «королевским», а тот, что ближе к ферзю, — «ферзевым».
